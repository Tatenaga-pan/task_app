<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン - Django Todo</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background: #f4f4f4; }
        .login-container { max-width: 400px; margin: 100px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #666; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>ログイン</h2>
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="id_username">ユーザー名</label>
                <input type="text" name="username" id = "id_username" required>
            </div>
            
            <div class="form-group">
                <label for="id_password">パスワード</label>
                <input type="password" name="password" id = "id_password" required>
            </div>
            
            <button type="submit">ログイン</button>
        </form>
    </div>
</body>
</html>
